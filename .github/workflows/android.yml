name: Build Code Doctor AI APK

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  push:
    branches: [ main, ast-scope-analysis, smart-nameerror-fix, security-autofix-preview ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Python analyzer regression tests
        run: PYTHONPATH=app/src/main/python python -m unittest discover -s app/src/test/python -v
      - name: Run compatibility regression tests
        run: PYTHONPATH=app/src/main/python python tests/test_analyzer.py
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: gradle --no-daemon assembleRelease
      - name: Download previous signed release for signature comparison
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: CodeDoctorAI-release-signed
          run-id: 42016146922
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: old-release
      - name: Verify APK signatures and print certificate fingerprints
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo '=== NEW RELEASE APK ==='
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          if [ -f old-release/app-release.apk ]; then
            echo '=== PREVIOUS SIGNED RELEASE APK ==='
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs old-release/app-release.apk
            NEW_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep 'Signer #1 certificate SHA-256 digest')
            OLD_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs old-release/app-release.apk | grep 'Signer #1 certificate SHA-256 digest')
            if [ "$NEW_CERT" != "$OLD_CERT" ]; then
              echo 'ERROR: Signing certificate differs from the previous signed release.'
              exit 1
            fi
            echo 'Signing certificate matches the previous signed release.'
          else
            echo 'Previous signed release artifact was not downloaded; only the new release signature was verified.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CodeDoctorAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          name: CodeDoctorAI-release-signed
          path: app/build/outputs/apk/release/app-release.apk
